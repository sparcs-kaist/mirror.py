[project]
name = "mirror.py"
version = "1.4.0"
description = "Mirror manager daemon that maintains local mirrors of remote package repositories via rsync, ftpsync, and other sync protocols."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Roul", email = "roul@ftp.kaist.ac.kr" },
    { name = "SPARCS@KAIST", email = "ftp@ftp.kaist.ac.kr" },
]
keywords = ["mirror", "rsync", "ftpsync", "debian", "daemon"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: System :: Archiving :: Mirroring",
    "Topic :: System :: Software Distribution",
]
dependencies = [
    "bandersnatch==6.5.0",
    "click==8.5.0",
    "prompt-toolkit>=3.0.53",
    # Bandersnatch 6.5 imports pkg_resources, removed in setuptools 82.
    "setuptools>=81,<82",
]

[project.urls]
Homepage = "https://mirror-py.sparcs.org/"
Documentation = "https://mirror-py.sparcs.org/"
Repository = "https://github.com/sparcs-kaist/mirror.py"
Issues = "https://github.com/sparcs-kaist/mirror.py/issues"

[project.optional-dependencies]
apt-mirror2 = ["apt-mirror==16"]

[tool.pytest.ini_options]
markers = [
    "integration: end-to-end tests that require Docker (deselected by default)",
    "unit: fast in-process unit tests (default selection)",
]
addopts = "-m 'not integration'"

[project.scripts]
mirror = "mirror.__main__:main"

[project.entry-points."mirror.sync"]
rsync = "mirror.sync.rsync:plugin"
ftpsync = "mirror.sync.ftpsync:plugin"
lftp = "mirror.sync.lftp:plugin"
bandersnatch = "mirror.sync.bandersnatch:plugin"
local = "mirror.sync.local:plugin"
ubuntu = "mirror.sync.ubuntu:plugin"
jigdo = "mirror.sync.jigdo:plugin"
debmirror = "mirror.sync.debmirror:plugin"
apt-mirror2 = "mirror.sync.apt_mirror2:plugin"

[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-docker>=3.2.5",
]
docs = [
    "sphinx==8.1.3",
    "sphinx-rtd-theme>=3.1.0",
    "myst-parser==4.0.1",
]

[tool.setuptools.packages.find]
include = ["mirror*"]
